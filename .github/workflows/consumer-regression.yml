# golden-field 消费回归（VP-024 R3 重构 · npmjs 公开发布 · 免凭据）
# 触发：手动 dispatch；或主仓发布后 repository_dispatch(published)（需主仓配置 + 本仓 GH token）。
# 行为：apps/api @latest + @magicvr/schema-ui-*（npmjs 公开）→ Go 构建 + serve 冒烟 +
#       healthz/readyz 轮询 + 四探针全绿 + SIGTERM 干净收尾（断言 shutdown.complete · RT-D02 出口）。
# 注（A-002 F-002 fixed）：pnpm/action-setup 必须先于 setup-node（cache: pnpm 需要 PATH 上的 pnpm）。
# 注（hosted 首跑 33286154992 · 2026-08-30）：action-setup v4 默认读【仓库根】package.json 的
#   packageManager 字段；web/package.json 的声明（pnpm@11.11.0）不被识别 → 失败。修复 = 显式 version 输入；
#   web/package.json 的 packageManager 保留作消费声明（本地 pnpm 一致性）。
# 注（hosted 二跑 33286191334 · 2026-08-30）：Go 构建 / pnpm 安装 / 四探针 / shutdown.complete 全 PASS，
#   但步骤仍 exit 1——收尾段 trap 内 kill 无 || true、wait 返回值受 set -e 影响。修复 = 清理段全 || true
#   + 显式 exit 0 + kill/wait 返回值诊断输出。
name: consumer-regression

on:
  workflow_dispatch:
  repository_dispatch:
    types: [published]

jobs:
  regression:
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Go 升级与构建（apps/api @latest · 公共 proxy 免凭据）
        run: |
          go get github.com/magicvr/schema-ui-core/apps/api@latest
          go mod tidy
          go build -o gf-server ./cmd/server

      - name: Web 安装（npmjs 公开 · 无 token；web/.npmrc 已钉 @magicvr → registry.npmjs.org）
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: serve 冒烟 + 探针 + SIGTERM 收尾（RT-D02）
        run: |
          ./gf-server -dialect sqlite -dsn /tmp/gf-ci.db -addr 127.0.0.1:25080 > /tmp/gf-ci-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -TERM $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:25080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          if [ "$ok" != "1" ]; then echo "serve 未就绪"; cat /tmp/gf-ci-server.log; exit 1; fi
          curl -sf http://127.0.0.1:25080/readyz >/dev/null || { echo "readyz 失败"; exit 1; }
          cd web
          node probe.mjs
          node probe-render.mjs
          node probe-six.mjs
          node token-check.mjs
          cd ..
          kill -TERM $SERVER_PID 2>/dev/null; krc=$?
          wait $SERVER_PID 2>/dev/null; wrc=$?
          echo "cleanup: kill=$krc wait=$wrc"
          grep -q 'shutdown.complete' /tmp/gf-ci-server.log || { echo "缺少 shutdown.complete"; exit 1; }
          echo "consumer-regression PASS · shutdown.complete 断言通过"
          exit 0